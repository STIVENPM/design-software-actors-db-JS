databaseChangeLog:
  - changeSet:
      id: dcl-roles-actors-001
      author: jesus-gonzalez
      labels: "dcl,roles"
      comment: Roles reader/writer/admin del dominio actors
      changes:
        - sqlFile: {path: 001_create_roles.sql, relativeToChangelogFile: true, splitStatements: false, stripComments: false}
      rollback:
        - sql: {sql: "DROP ROLE IF EXISTS actors_reader; DROP ROLE IF EXISTS actors_writer; DROP ROLE IF EXISTS actors_admin;"}
